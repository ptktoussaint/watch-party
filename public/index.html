<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPS FLUXO</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Tela de entrada -->
  <div id="join-screen" class="screen">
    <div class="card">
      <h1 class="logo-text">💜UPS FLUXO</h1>
      <form id="join-form">
        <label for="name-input">Seu nome</label>
        <input id="name-input" type="text" placeholder="Como você quer ser chamado?" maxlength="40" required>

        <label for="room-input">Código da sala</label>
        <input id="room-input" type="text" placeholder="ex: cinema-da-galera" maxlength="40" required>

        <button type="submit">Entrar na sala</button>
      </form>
      <p class="hint">Se a sala não existir, ela será criada automaticamente. Compartilhe o mesmo código com quem você quer chamar.</p>
      <p class="site-signature">Site desenvolvido por .patricktoussaint</p>
    </div>
  </div>

  <!-- Sala -->
  <div id="room-screen" class="screen hidden">
    <div class="room-layout">
      <div class="video-area">
        <div class="player-wrap">
          <div id="player"></div>
          <div id="player-block" class="hidden"></div>
        </div>
        <div class="video-actions">
          <select id="quality-select" title="Qualidade do vídeo">
            <option value="default">Qualidade: Automática</option>
            <option value="hd1080">1080p</option>
            <option value="hd720">720p</option>
            <option value="large">480p</option>
            <option value="medium">360p</option>
            <option value="small">240p</option>
          </select>
          <button id="fullscreen-btn" type="button">⛶ Tela cheia</button>
        </div>
        <div id="host-controls" class="hidden">
          <input id="video-url-input" type="text" placeholder="Cole o link do YouTube aqui...">
          <button id="load-video-btn">Carregar vídeo</button>
        </div>
        <p id="no-host-msg" class="hint hidden">Aguardando o host escolher um vídeo...</p>
      </div>

      <div class="sidebar">
        <h3>Sala: <span id="room-name-display"></span></h3>
        <h4>Participantes (<span id="participant-count">0</span>)</h4>
        <ul id="participant-list"></ul>
        <p class="site-signature sidebar-signature">Site desenvolvido por .patricktoussaint</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="client.js"></script>
</body>
</html>
