# coturn — relay para redes que bloqueiam conexão direta (NAT simétrico, firewalls corporativos, 4G).
# O segredo abaixo deve ser o MESMO valor de TURN_SECRET no Rise. Troque domínio, IP e segredo.
listening-port=3478
tls-listening-port=5349
realm=turn.exemplo.com
server-name=turn.exemplo.com
external-ip=203.0.113.10

fingerprint
use-auth-secret
static-auth-secret=TROQUE_POR_UM_SEGREDO_LONGO

# faixa de portas de mídia (libere no firewall: UDP 3478, TCP/UDP 5349 e esta faixa)
min-port=49160
max-port=49300

# não deixa o relay alcançar a rede interna do servidor
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# certificado para turns: (opcional)
# cert=/etc/letsencrypt/live/turn.exemplo.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.exemplo.com/privkey.pem

no-cli
total-quota=200
